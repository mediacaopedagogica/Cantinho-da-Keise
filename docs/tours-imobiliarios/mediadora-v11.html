<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mediação — Tours virtuais e negociação imobiliária</title>
<link rel="stylesheet" href="mediadora-v11.css">
</head>
<body>
<main class="wrap">
<section class="hero"><div><div class="eyebrow">Área privada de mediação</div><h1>Tours virtuais e negociação imobiliária</h1></div><div class="brand"><img src="logo.svg" alt="FMU FIAM-FAAM"></div></section>
<section class="card">
 <div id="loginBox" class="login"><p>Digite sua senha de mediação. Seus comentários serão publicados automaticamente como <strong>Mediadora Pedagógica</strong>, sem campo de nome e sem estrelas.</p><input id="password" type="password" placeholder="Senha da mediadora"><button id="login" type="button">Entrar</button></div>
 <div id="panel" class="hidden"><div class="toolbar"><div><h2>Comentários da turma</h2><div id="total" style="color:var(--muted);font-size:11px;margin-top:4px">0 comentários</div></div><div class="toolbar-actions"><button class="tiny" id="expand" type="button">Expandir todos</button><button class="tiny" id="collapse" type="button">Recolher todos</button><button class="tiny" id="logout" type="button">Sair</button></div></div><div id="list"></div></div>
</section>
</main>
<div id="toast" class="toast"></div>
<script type="module" src="mediadora-v11.js"></script>
</body>
</html>
