<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mediação — Tours virtuais</title><style>:root{--bg:#05161c;--bg2:#0b2d36;--text:#f7fbfc;--muted:#a8c0c6;--line:rgba(255,255,255,.13);--cyan:#65e4ec;--gold:#e1b76d;--red:#c61c2a;--green:#91e7b6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% 0,rgba(101,228,236,.16),transparent 28%),linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}button,input,textarea{font:inherit}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:28px 0}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0;font-size:clamp(30px,4vw,48px);letter-spacing:-.04em}.brand{background:#fff;padding:9px 12px;border-radius:12px}.brand img{display:block;width:170px}.eyebrow{color:#f4d7a1;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:900;margin-bottom:8px}.card{margin-top:20px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.045);padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.status{padding:11px 13px;border-radius:12px;border:1px solid var(--line);color:var(--muted);margin-bottom:14px}.status.ok{color:var(--green)}.status.err{color:#ffb9bf}.login{max-width:420px}.login input{width:100%;background:#071b21;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px 13px;outline:none}.login button,.reply-btn,.tiny{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.login button{margin-top:10px;background:linear-gradient(135deg,#e33b48,#a91420);color:#fff}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar h2{margin:0}.toolbar-actions{display:flex;gap:7px;flex-wrap:wrap}.tiny{background:rgba(255,255,255,.04);color:#e4eff1;border:1px solid var(--line);font-size:11px}.thread{border-top:1px solid rgba(255,255,255,.08)}.thread:first-child{border-top:0}.thread summary{list-style:none;cursor:pointer;padding:15px 0}.thread summary::-webkit-details-marker{display:none}.sum{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(101,228,236,.18),rgba(225,183,109,.18));border:1px solid var(--line);font-weight:900}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.meta strong{font-size:14px}.meta time{font-size:11px;color:var(--muted)}.med{background:linear-gradient(135deg,#b91826,#e43b47);padding:4px 8px;border-radius:999px}.tag{font-size:10px;text-transform:uppercase;color:#ffd5d8;font-weight:900}.preview{margin-top:4px;color:#b9ced3;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center}.thread[open]>.sum-wrap .chev{transform:rotate(180deg)}.body{padding:0 0 16px 56px}.text{line-height:1.62;color:#e2edef;white-space:pre-wrap}.stars{margin-top:8px;color:#f4d7a1}.stars .off{color:#3d4a4e}.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.reply-btn{background:rgba(101,228,236,.09);color:#c9fbff;border:1px solid rgba(101,228,236,.22);font-size:11px}.count{font-size:11px;color:var(--muted)}.reply-form{display:none;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.08)}.reply-form.open{display:block}.reply-form textarea{width:100%;min-height:90px;resize:vertical;background:#071b21;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px}.reply-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:8px}.reply-actions button{border:1px solid var(--line);background:transparent;color:#fff;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800}.reply-actions .send{background:rgba(101,228,236,.11);color:#c9fbff}.children{margin-left:16px;padding-left:14px;border-left:1px solid rgba(101,228,236,.18)}.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d3038;border:1px solid var(--line);padding:11px 14px;border-radius:12px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.body{padding-left:12px}.children{margin-left:8px;padding-left:8px}}</style></head><body><main class="wrap"><section class="hero"><div><div class="eyebrow">Área privada de mediação</div><h1>Tours virtuais e mercado imobiliário</h1></div><div class="brand"><img src="logo.svg" alt="FMU FIAM-FAAM"></div></section><section class="card"><div id="status" class="status">Carregando área da mediadora...</div><div id="loginBox" class="login"><p style="color:var(--muted)">Digite apenas sua senha privada. O sistema publicará automaticamente como <strong>Mediadora Pedagógica</strong>, sem nome manual e sem estrelas.</p><input id="password" type="password" placeholder="Senha da mediadora"><button id="login" type="button">Entrar</button></div><div id="panel" class="hidden"><div class="toolbar"><div><h2>Comentários da turma</h2><div id="total" style="color:var(--muted);font-size:12px;margin-top:4px">0 comentários</div></div><div class="toolbar-actions"><button class="tiny" id="expand" type="button">Expandir todos</button><button class="tiny" id="collapse" type="button">Recolher todos</button><button class="tiny" id="logout" type="button">Sair</button></div></div><div id="list"></div></div></section></main><div id="toast" class="toast"></div><script src="config.js"></script><script type="module">(async()=>{const cfg=window.FORUM_CONFIG,status=document.getElementById('status'),loginBox=document.getElementById('loginBox'),panel=document.getElementById('panel'),password=document.getElementById('password'),login=document.getElementById('login'),logout=document.getElementById('logout'),list=document.getElementById('list'),total=document.getElementById('total');let supabase,comments=[],ratings=[],pwd=sessionStorage.getItem('mediadoraToursPwd')||'';const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm');supabase=mod.createClient(cfg.supabaseUrl,cfg.anonKey);function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}function initials(name){return(name||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||'').join('')||'A'}function fmt(iso){return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function starsMarkup(n){let s='<div class="stars">';for(let i=1;i<=5;i++)s+=`<span class="${i<=n?'':'off'}">★</span>`;return s+'</div>'}async function check(p){const{data,error}=await supabase.rpc('check_mediator_password',{p_activity_key:cfg.activityKey,p_password:p});return !error&&data===true}function ui(ok){loginBox.classList.toggle('hidden',ok);panel.classList.toggle('hidden',!ok);status.className='status '+(ok?'ok':'');status.textContent=ok?'Área da mediadora conectada. Seus comentários aparecem como “Mediadora Pedagógica comentou”.':'Digite sua senha privada de mediação.'}login.onclick=async()=>{const p=password.value.trim();if(!p)return;if(await check(p)){pwd=p;sessionStorage.setItem('mediadoraToursPwd',p);ui(true);await refresh()}else toast('Senha inválida.')};logout.onclick=()=>{sessionStorage.removeItem('mediadoraToursPwd');location.reload()};async function refresh(){const[{data:c},{data:r}]=await Promise.all([supabase.from('forum_comments').select('*').eq('activity_key',cfg.activityKey).order('created_at',{ascending:true}),supabase.from('forum_ratings').select('*').eq('activity_key',cfg.activityKey)]);comments=c||[];ratings=r||[];render()}function tree(){const m=new Map(comments.map(c=>[c.id,{...c,children:[]}])),roots=[];m.forEach(c=>{if(c.parent_id&&m.has(c.parent_id))m.get(c.parent_id).children.push(c);else roots.push(c)});return roots}function desc(c){return c.children.reduce((n,x)=>n+1+desc(x),0)}function ratingFor(c){return ratings.find(r=>r.normalized_name===c.normalized_name)}function first(c){return comments.filter(x=>x.normalized_name===c.normalized_name).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))[0]?.id===c.id}function replyForm(parent){const f=document.createElement('form');f.className='reply-form';f.innerHTML='<textarea maxlength="1800" placeholder="Responder como Mediadora Pedagógica..."></textarea><div class="reply-actions"><button type="button" class="cancel">Cancelar</button><button type="submit" class="send">Publicar como mediadora</button></div>';f.querySelector('.cancel').onclick=()=>f.classList.remove('open');f.onsubmit=async e=>{e.preventDefault();const body=f.querySelector('textarea').value.trim();if(body.length<2)return;const{error}=await supabase.rpc('submit_mediator_comment',{p_activity_key:cfg.activityKey,p_parent_id:parent.id,p_body:body,p_password:pwd});if(error){toast(error.message);return}f.classList.remove('open');await refresh();toast('Comentário publicado como Mediadora Pedagógica.')};return f}function node(c){const d=document.createElement('details');d.className='thread';const s=document.createElement('summary');s.className='sum-wrap';s.innerHTML=`<div class="sum"><div class="avatar">${c.author_role==='mediator'?'MP':initials(c.author_name)}</div><div><div class="meta"><strong class="${c.author_role==='mediator'?'med':''}"></strong><time>${fmt(c.created_at)}</time>${c.author_role==='mediator'?'<span class="tag">comentou</span>':''}</div><div class="preview"></div></div><div class="chev">⌄</div></div>`;s.querySelector('strong').textContent=c.author_name;s.querySelector('.preview').textContent=c.body;d.appendChild(s);const body=document.createElement('div');body.className='body';const txt=document.createElement('div');txt.className='text';txt.textContent=c.body;body.appendChild(txt);if(c.author_role==='student'&&first(c)){const r=ratingFor(c);if(r){const x=document.createElement('div');x.innerHTML=starsMarkup(r.stars);body.appendChild(x.firstElementChild)}}const actions=document.createElement('div');actions.className='actions';const b=document.createElement('button');b.type='button';b.className='reply-btn';b.textContent='Responder como mediadora';const n=desc(c),ct=document.createElement('span');ct.className='count';ct.textContent=n?`${n} ${n===1?'resposta':'respostas'}`:'Nenhuma resposta';actions.append(b,ct);body.appendChild(actions);const rf=replyForm(c);b.onclick=()=>rf.classList.toggle('open');body.appendChild(rf);if(c.children.length){const ch=document.createElement('div');ch.className='children';c.children.forEach(x=>ch.appendChild(node(x)));body.appendChild(ch)}d.appendChild(body);return d}function render(){list.innerHTML='';const roots=tree();total.textContent=`${comments.length} comentários`;if(!roots.length){const e=document.createElement('div');e.className='empty';e.textContent='Ainda não há comentários.';list.appendChild(e);return}roots.forEach(x=>list.appendChild(node(x)))}document.getElementById('expand').onclick=()=>document.querySelectorAll('.thread').forEach(d=>d.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('.thread').forEach(d=>d.open=false);if(pwd&&await check(pwd)){ui(true);await refresh()}else{sessionStorage.removeItem('mediadoraToursPwd');ui(false)}setInterval(()=>{if(pwd)refresh()},5000)})();</script></body></html>
