<div id="salinha-keise" lang="pt-BR">
<style>
#salinha-keise{
  --panel:#fffaf4;
  --text:#302925;
  --border:#d9c9b7;
  --accent:#aa604f;
  --access-bg:rgba(35,28,22,.96);
  font-family:Arial,Helvetica,sans-serif;
  width:100%;
  max-width:1600px;
  margin:0 auto;
  color:var(--text);
}
#salinha-keise *{box-sizing:border-box}

#salinha-keise .sk-scene{
  position:relative;
  width:100%;
  aspect-ratio:3/2;
  overflow:hidden;
  border-radius:16px;
  background:#2b2119;
}
#salinha-keise .sk-scene-img{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}

/* Hotspots transparentes sobre os pontos luminosos JA existentes na imagem aprovada. */
#salinha-keise .sk-hotspot{
  position:absolute;
  z-index:20;
  transform:translate(-50%,-50%);
  width:clamp(46px,4.2vw,68px);
  height:clamp(46px,4.2vw,68px);
  padding:0;
  margin:0;
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}
#salinha-keise .sk-hotspot::after{
  content:"";
  position:absolute;
  inset:9%;
  border:2px solid transparent;
  border-radius:50%;
  pointer-events:none;
}
#salinha-keise .sk-hotspot:hover::after,
#salinha-keise .sk-hotspot:focus-visible::after,
#salinha-keise .sk-hotspot.sk-selected::after{
  border-color:#fff;
  box-shadow:0 0 0 4px rgba(216,169,94,.72),0 0 20px rgba(255,220,125,.95);
}
#salinha-keise .sk-hotspot:focus-visible{outline:none}

/* Coordenadas da NOVA imagem aprovada 1536 x 1024. */
#salinha-keise [data-key="cert1"]{left:38.67%;top:8.30%}
#salinha-keise [data-key="cert2"]{left:38.67%;top:26.86%}
#salinha-keise [data-key="quadro"]{left:74.15%;top:10.16%}
#salinha-keise [data-key="gato"]{left:19.99%;top:45.12%}
#salinha-keise [data-key="notebook"]{left:11.46%;top:70.70%}
#salinha-keise [data-key="caneca"]{left:32.42%;top:70.70%}
#salinha-keise [data-key="planner"]{left:49.74%;top:76.07%}
#salinha-keise [data-key="canetas"]{left:78.78%;top:62.30%}
#salinha-keise [data-key="envelope"]{left:72.92%;top:76.07%}
#salinha-keise [data-key="planta"]{left:94.53%;top:78.13%}

/* Apenas os dois recursos mantidos: ouvir pagina e navegacao por teclado. */
#salinha-keise .sk-access-bar{
  position:absolute;
  z-index:30;
  right:2.2%;
  bottom:2.2%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.24);
  border-radius:999px;
  background:var(--access-bg);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
#salinha-keise .sk-access-btn{
  display:flex;
  align-items:center;
  gap:8px;
  border:0;
  background:transparent;
  color:#fff;
  padding:8px 11px;
  border-radius:999px;
  cursor:pointer;
  font-size:clamp(12px,1.05vw,16px);
  line-height:1.1;
  white-space:nowrap;
}
#salinha-keise .sk-access-btn:hover,
#salinha-keise .sk-access-btn:focus-visible,
#salinha-keise .sk-access-btn[aria-pressed="true"]{
  background:rgba(216,169,94,.22);
  outline:none;
  box-shadow:inset 0 0 0 1px rgba(216,169,94,.72);
}
#salinha-keise .sk-access-icon{
  font-size:1.2em;
  line-height:1;
}

/* Modal */
#salinha-keise .sk-modal{
  position:fixed;
  inset:0;
  z-index:999999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(25,18,14,.72);
}
#salinha-keise .sk-modal.sk-open{display:flex}
#salinha-keise .sk-dialog{
  position:relative;
  width:min(700px,94vw);
  max-height:86vh;
  overflow:auto;
  padding:clamp(22px,4vw,36px);
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--panel);
  box-shadow:0 24px 70px rgba(0,0,0,.38);
}
#salinha-keise .sk-dialog h2{
  margin:0 48px 14px 0;
  font:700 clamp(27px,4vw,42px)/1.12 Georgia,serif;
}
#salinha-keise .sk-dialog p{
  margin:0 0 14px;
  font-size:clamp(16px,1.5vw,19px);
  line-height:1.65;
}
#salinha-keise .sk-close{
  position:absolute;
  top:12px;
  right:12px;
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:50%;
  background:#efe4d7;
  color:#302925;
  font-size:28px;
  cursor:pointer;
}
#salinha-keise .sk-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:18px;
}
#salinha-keise .sk-actions button{
  border:1px solid var(--border);
  border-radius:999px;
  padding:10px 14px;
  background:#fff;
  color:#302925;
  cursor:pointer;
  font-size:15px;
}
#salinha-keise .sk-actions .sk-primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
#salinha-keise .sk-status{
  margin-top:14px;
  font-size:13px;
  color:#665d56;
}
#salinha-keise .sk-close:focus-visible,
#salinha-keise .sk-actions button:focus-visible{
  outline:3px solid #174ea6;
  outline-offset:3px;
}

@media(max-width:700px){
  #salinha-keise .sk-scene{border-radius:8px}
  #salinha-keise .sk-hotspot{width:50px;height:50px}
  #salinha-keise .sk-access-bar{
    right:1.5%;
    bottom:1.5%;
    gap:3px;
    padding:4px 6px;
  }
  #salinha-keise .sk-access-btn{
    font-size:10px;
    padding:5px 6px;
  }
}

#salinha-keise .sk-linkedin{
  display:inline-block;
  margin-top:8px;
  color:#6b625c;
  font-size:14px;
  text-decoration:underline;
  text-underline-offset:3px;
}
#salinha-keise .sk-linkedin:hover,
#salinha-keise .sk-linkedin:focus-visible{
  color:#302925;
  outline:2px solid #174ea6;
  outline-offset:3px;
  border-radius:4px;
}

</style>

        "Aprendizagem em crescimento.",
        "Aprender \u00e9 um processo que acontece aos poucos, no seu tempo.",
        "Cada participa\u00e7\u00e3o, cada d\u00favida e cada nova descoberta fazem parte desse caminho.",
        "O mais importante \u00e9 continuar avan\u00e7ando, mesmo que em pequenos passos.",
        "Porque toda aprendizagem cresce quando existe curiosidade, presen\u00e7a e vontade de seguir."
      ],
      description:[
        "Audiodescri\u00e7\u00e3o.",
        "No canto inferior direito da cena h\u00e1 uma planta verde e volumosa em um vaso claro.",
        "Ela acrescenta um elemento natural ao ambiente de estudos."
      ]
    }
  };

  var hotspots=Array.prototype.slice.call(root.querySelectorAll(".sk-hotspot"));
  var current=null;
  var lastFocus=null;
  var selectedVoice=null;
  var speechRun=0;
  var keyboardMode=false;

  function pickVoice(){
    if(!("speechSynthesis" in window))return null;
    var voices=window.speechSynthesis.getVoices()||[];
    var ptbr=voices.filter(function(v){return /^pt[-_]BR$/i.test(v.lang||"");});
    var names=["Francisca","Maria","Luciana","Leticia","Camila","Fernanda","Vitoria","Isabela","Helena","Mariana"];
    for(var i=0;i<names.length;i++){
      for(var j=0;j<ptbr.length;j++){
        if((ptbr[j].name||"").toLowerCase().indexOf(names[i].toLowerCase())!==-1){
          return ptbr[j];
        }
      }
    }
    return ptbr[0]||voices.find(function(v){return /^pt/i.test(v.lang||"");})||voices[0]||null;
  }

  function refreshVoice(){selectedVoice=pickVoice();}

  if("speechSynthesis" in window){
    refreshVoice();
    window.speechSynthesis.onvoiceschanged=refreshVoice;
  }

  function speakBlocks(blocks){
    if(!("speechSynthesis" in window)){
      alert("A leitura em voz alta nao esta disponivel neste navegador.");
      return;
    }

    speechRun++;
    root.querySelector("#sk-pause").innerHTML="&#10074;&#10074; Pausar";

    var run=speechRun;
    window.speechSynthesis.cancel();
    var index=0;

    function next(){
      if(run!==speechRun||index>=blocks.length)return;

      var text=blocks[index++];
      if(!text){setTimeout(next,250);return;}

      var utterance=new SpeechSynthesisUtterance(String(text));
      utterance.lang="pt-BR";
      utterance.rate=0.88;
      utterance.pitch=1.02;
      utterance.volume=1;
      if(selectedVoice)utterance.voice=selectedVoice;

      utterance.onend=function(){
        if(run===speechRun)setTimeout(next,360);
      };
      utterance.onerror=function(){
        if(run===speechRun)setTimeout(next,250);
      };

      window.speechSynthesis.speak(utterance);
    }

    next();
  }

  function togglePause(){
    if(!("speechSynthesis" in window))return;

    if(window.speechSynthesis.paused){
      window.speechSynthesis.resume();
      root.querySelector("#sk-pause").innerHTML="&#10074;&#10074; Pausar";
      root.querySelector("#sk-status").innerHTML="&Aacute;udio retomado.";
    }else if(window.speechSynthesis.speaking){
      window.speechSynthesis.pause();
      root.querySelector("#sk-pause").innerHTML="&#9654; Continuar";
      root.querySelector("#sk-status").innerHTML="&Aacute;udio pausado.";
    }
  }

  function stopAudio(){
    speechRun++;
    if("speechSynthesis" in window)window.speechSynthesis.cancel();
    root.querySelector("#sk-pause").innerHTML="&#10074;&#10074; Pausar";
  }

  function mark(el){
    hotspots.forEach(function(h){
      h.classList.remove("sk-selected");
      h.removeAttribute("aria-current");
    });
    if(el){
      el.classList.add("sk-selected");
      el.setAttribute("aria-current","true");
    }
  }

  function fullSpeech(item){
    return item.speech.concat(item.description);
  }

  function openItem(key){
    var item=items[key];
    if(!item)return;

    stopAudio();
    current=key;
    lastFocus=document.activeElement;

    var hotspot=root.querySelector('.sk-hotspot[data-key="'+key+'"]');
    mark(hotspot);

    root.querySelector("#sk-title").textContent=item.title;
    root.querySelector("#sk-body").innerHTML=item.html;
    root.querySelector("#sk-status").innerHTML="O &aacute;udio &eacute; opcional. Clique em Ouvir se desejar.";

    root.querySelector("#sk-modal").classList.add("sk-open");
    root.querySelector("#sk-close").focus();
  }

  function closeItem(){
    stopAudio();
    root.querySelector("#sk-modal").classList.remove("sk-open");
    if(lastFocus&&typeof lastFocus.focus==="function")lastFocus.focus();
  }

  function listenCurrent(){
    if(!current||!items[current])return;
    root.querySelector("#sk-status").innerHTML="Reproduzindo conte&uacute;do e audiodescri&ccedil;&atilde;o.";
    speakBlocks(fullSpeech(items[current]));
  }

  function readPage(){
    speakBlocks([
      "Salinha interativa da media\u00e7\u00e3o pedag\u00f3gica.",
      "Explore os pontos luminosos para conhecer cada descoberta.",
      "O \u00e1udio \u00e9 opcional.",
      "Para navegar com as setas, ative o bot\u00e3o Navega\u00e7\u00e3o por teclado."
    ]);
  }

  function toggleKeyboardMode(){
    keyboardMode=!keyboardMode;
    var btn=root.querySelector("#sk-keyboard-mode");
    btn.setAttribute("aria-pressed",keyboardMode ? "true" : "false");

    if(keyboardMode){
      var first=root.querySelector(".sk-hotspot.sk-selected")||hotspots[0];
      if(first){
        mark(first);
        first.focus({preventScroll:true});
      }
      speakBlocks([
        "Navega\u00e7\u00e3o por teclado ativada.",
        "Use as setas para escolher um ponto luminoso.",
        "Pressione Enter ou Espa\u00e7o para abrir o item.",
        "A leitura em voz alta continua opcional."
      ]);
    }else{
      stopAudio();
    }
  }

  hotspots.forEach(function(h){
    h.addEventListener("click",function(e){
      e.preventDefault();
      e.stopPropagation();
      openItem(h.getAttribute("data-key"));
    });
    h.addEventListener("focus",function(){mark(h);});
  });

  root.querySelector("#sk-read-page").addEventListener("click",readPage);
  root.querySelector("#sk-keyboard-mode").addEventListener("click",toggleKeyboardMode);
  root.querySelector("#sk-close").addEventListener("click",closeItem);
  root.querySelector("#sk-listen").addEventListener("click",listenCurrent);
  root.querySelector("#sk-pause").addEventListener("click",togglePause);

  root.querySelector("#sk-modal").addEventListener("click",function(e){
    if(e.target===this)closeItem();
  });

  function activeHotspot(){
    var active=document.activeElement;
    if(active&&active.classList&&active.classList.contains("sk-hotspot"))return active;
    return root.querySelector(".sk-hotspot.sk-selected")||hotspots[0];
  }

  function move(direction){
    if(!keyboardMode)return;

    var from=activeHotspot();
    if(!from)return;

    var r=from.getBoundingClientRect();
    var cx=r.left+r.width/2;
    var cy=r.top+r.height/2;

    var candidates=hotspots.filter(function(el){
      if(el===from)return false;

      var rr=el.getBoundingClientRect();
      var x=rr.left+rr.width/2;
      var y=rr.top+rr.height/2;

      if(direction==="left")return x<cx-3;
      if(direction==="right")return x>cx+3;
      if(direction==="up")return y<cy-3;
      if(direction==="down")return y>cy+3;
      return false;
    });

    if(!candidates.length)return;

    candidates.sort(function(a,b){
      function score(el){
        var rr=el.getBoundingClientRect();
        var x=rr.left+rr.width/2;
        var y=rr.top+rr.height/2;
        var dx=Math.abs(x-cx);
        var dy=Math.abs(y-cy);
        return (direction==="left"||direction==="right") ? dx+dy*0.72 : dy+dx*0.72;
      }
      return score(a)-score(b);
    });

    var target=candidates[0];
    mark(target);
    target.focus({preventScroll:true});
  }

  document.addEventListener("keydown",function(e){
    var modalOpen=root.querySelector("#sk-modal").classList.contains("sk-open");
    var focusInside=root.contains(document.activeElement);

    if(e.key==="Escape"&&modalOpen){
      e.preventDefault();
      closeItem();
      return;
    }

    if(modalOpen||!focusInside)return;

    if(keyboardMode){
      if(e.key==="ArrowLeft"){
        e.preventDefault();move("left");
      }else if(e.key==="ArrowRight"){
        e.preventDefault();move("right");
      }else if(e.key==="ArrowUp"){
        e.preventDefault();move("up");
      }else if(e.key==="ArrowDown"){
        e.preventDefault();move("down");
      }
    }

    if((e.key==="Enter"||e.key===" ")&&
       document.activeElement&&
       document.activeElement.classList.contains("sk-hotspot")){
      e.preventDefault();
      openItem(document.activeElement.getAttribute("data-key"));
    }
  });
})();
</script>
</div>
